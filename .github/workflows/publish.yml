# Publishes this n8n community node to public npm with provenance on tag push.
# Tag format: n8n-nodes-datagrout@<version> (must match package.json version).
name: Publish package

on:
  push:
    tags:
      - 'n8n-nodes-datagrout@*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm >= 11.5.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Lint (strict, must stay clean)
        run: npm run lint

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#*@}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)"; exit 1
          fi

      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
