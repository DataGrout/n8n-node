# Publishes this n8n community node to public npm with provenance on tag push.
# Tag format: <version>, e.g. 0.3.0 (must match package.json version).
# Tags up to 0.2.0 used the monorepo form n8n-nodes-datagrout@<version>; both
# are accepted so the older tags keep resolving.
name: Publish package

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'n8n-nodes-datagrout@*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm >= 11.5.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Lint (strict, must stay clean)
        run: npm run lint

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          # Accepts 0.3.0, v0.3.0, and the legacy n8n-nodes-datagrout@0.3.0.
          TAG_VERSION="${GITHUB_REF_NAME##*@}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)"; exit 1
          fi

      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
