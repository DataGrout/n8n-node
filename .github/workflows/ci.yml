name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - n8n-nodes-datagrout
          - n8n-nodes-datagrout-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Root workspace install; the single root lockfile is canonical.
      # --ignore-scripts skips isolated-vm's native build (a transitive dep of
      # n8n's expression runtime) — it is only needed at n8n runtime, never for
      # building or linting these packages.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build --workspace=packages/${{ matrix.package }}

      - name: Lint (strict, verified package only)
        if: matrix.package == 'n8n-nodes-datagrout'
        run: npm run lint --workspace=packages/${{ matrix.package }}
